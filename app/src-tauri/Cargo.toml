[package]
name = "s5000-tools-app"
version = "0.1.0"
description = "s5000-tools: desktop editor for the Akai S5000/S6000 sampler"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "s5000-tools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-drag = "=2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
s5k = { path = "../../crates/s5k" }
s5k-formats = { path = "../../crates/s5k-formats" }
s5k-usb = { path = "../../crates/s5k-usb" }
