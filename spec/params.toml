[[param]]
id = "zone.low_velocity"
scope = "zone"
label = "Low velocity"
section = 0x06
set_item = 0x0C
get_item = 0x2C
index = { name = "zone", min = 1, max = 4 }
encoding = "u7"
min = 0
max = 127
source = "spec"

[[param]]
id = "zone.mute"
scope = "zone"
label = "Zone mute"
section = 0x06
set_item = 0x0D
get_item = 0x2D
index = { name = "zone", min = 1, max = 4 }
encoding = "bool"
min = 0
max = 1
source = "spec"

[[param]]
id = "zone.solo"
scope = "zone"
label = "Zone solo"
section = 0x06
set_item = 0x0E
get_item = 0x2E
index = { name = "zone", min = 1, max = 4 }
