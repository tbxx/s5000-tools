label = "Fine tune"
section = 0x06
set_item = 0x06
get_item = 0x26
index = { name = "zone", min = 1, max = 4 }
encoding = "signed7"
min = -50
max = 50
file = { format = "akp", section = "Zone", field = "fine" }
source = "both"

[[param]]
id = "zone.semitone"
scope = "zone"
label = "Semitone tune"
section = 0x06
set_item = 0x07
get_item = 0x27
index = { name = "zone", min = 1, max = 4 }
encoding = "signed7"
min = -36
max = 36
file = { format = "akp", section = "Zone", field = "semitone" }
source = "both"

[[param]]
id = "zone.keyboard_tracking"
scope = "zone"
label = "Keyboard tracking"
section = 0x06
set_item = 0x08
get_item = 0x28
index = { name = "zone", min = 1, max = 4 }
encoding = "bool"
min = 0
max = 1
file = { format = "akp", section = "Zone", field = "keyboard_tracking" }
source = "both"

[[param]]
id = "zone.playback"
scope = "zone"
label = "Playback mode"
section = 0x06
set_item = 0x09
get_item = 0x29
index = { name = "zone", min = 1, max = 4 }
encoding = "u7"
min = 0
max = 6
file = { format = "akp", section = "Zone", field = "playback" }
source = "both"
notes = "Observed: 0 = as sample. The spec's order (0 no looping ... 6 as sample) conflicts with that, so the value names are left unassigned; see discrepancies.md."

[[param]]
id = "zone.velocity_start"
scope = "zone"
label = "Velocity > start"
section = 0x06
