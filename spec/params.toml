# s5000-tools parameter catalog.
#
# A factual description of the Akai S5000/S6000 SysEx parameters, compiled from
# Akai's "S5000/S6000 MIDI System Exclusive Protocol Specification" (v2.10) and
# from hardware observation (docs/protocol.md, docs/file-formats.md,
# docs/effects.md). Schema: spec/README.md. Disagreements: spec/discrepancies.md.

