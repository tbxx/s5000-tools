# ------------------------------------------------------------ system

[[param]]
id = "system.os_version"
scope = "system"
label = "OS version"
section = 0x02
get_item = 0x00
source = "both"
notes = "Composite reply: major byte then minor byte (e.g. 02 0E)."

[[param]]
id = "system.os_subversion"
scope = "system"
label = "OS sub-version"
section = 0x02
get_item = 0x01
encoding = "u7"
min = 0
max = 127
source = "both"
notes = "Spec says always 0. ak.Sys polls it at start-up."

[[param]]
id = "system.name"
scope = "system"
label = "Sampler name"
section = 0x02
set_item = 0x02
get_item = 0x03
encoding = "string"
source = "both"
notes = "Defaults to the model name, e.g. \"AKAI S5000\"."

[[param]]
id = "system.model"
scope = "system"
label = "Model"
section = 0x02
get_item = 0x04
encoding = "enum"
values = ["S5000", "S6000"]
min = 0
max = 1
source = "both"

[[param]]
id = "system.clock"
scope = "system"
label = "Clock"
section = 0x02
set_item = 0x06
get_item = 0x05
source = "spec"
notes = "Composite, 8 bytes: year as u14 (1980-2079), month 1-12, day 1-31, weekday 1-7 (1 = Sunday), hour 0-23, minute 0-59, second 0-59."

[[param]]
id = "system.play_mode"
scope = "system"
label = "Play mode"
section = 0x02
set_item = 0x10
get_item = 0x20
encoding = "enum"
list = "play_mode"
min = 0
max = 3
source = "both"
notes = "ak.Sys polls 02 20 every few seconds."

[[param]]
id = "system.panel_lock"
scope = "system"
label = "Front panel lock"
section = 0x02
set_item = 0x11
get_item = 0x21
encoding = "bool"
min = 0
max = 1
source = "both"
notes = "1 = front panel locked out."

[[param]]
id = "system.wave_memory_free_pct"
scope = "system"
label = "Wave memory free"
section = 0x02
get_item = 0x30
encoding = "u7"
min = 0
max = 100
units = "%"
source = "both"

[[param]]
id = "system.mpks_memory_free_pct"
scope = "system"
label = "MPKS memory free"
section = 0x02
get_item = 0x31
encoding = "u7"
min = 0
max = 100
units = "%"
source = "both"
notes = "Memory for multis, programs, keygroups and samples (the docs call it CPU memory)."

[[param]]
id = "system.wave_memory_total"
scope = "system"
label = "Wave memory installed"
section = 0x02
get_item = 0x33
encoding = "u28"
min = 0
units = "bytes"
source = "spec"

[[param]]
id = "system.wave_memory_free"
scope = "system"
label = "Wave memory free (bytes)"
section = 0x02
get_item = 0x34
encoding = "u28"
min = 0
units = "bytes"
source = "spec"

# ------------------------------------------------------------ midi

[[param]]
id = "midi.program_change"
scope = "midi"
label = "Program change"
section = 0x04
set_item = 0x01
encoding = "bool"
min = 0
max = 1
source = "spec"

[[param]]
id = "midi.multi_select"
scope = "midi"
label = "Multi select"
section = 0x04
set_item = 0x02
encoding = "enum"
values = ["OFF", "PROG CHANGE", "BANK"]
min = 0
max = 2
source = "spec"

[[param]]
id = "midi.multi_select_channel"
scope = "midi"
label = "Multi select channel"
section = 0x04
set_item = 0x03
encoding = "enum"
list = "midi_channel"
min = 0
max = 31
source = "spec"

[[param]]
id = "midi.apm_controller"
scope = "midi"
label = "External APM controller"
section = 0x04
set_item = 0x04
encoding = "u7"
min = 0
max = 127
source = "spec"
notes = "Presumably a MIDI controller number; the spec gives only the range."

[[param]]
id = "midi.aftertouch_mode"
scope = "midi"
label = "Aftertouch type"
section = 0x04
set_item = 0x05
encoding = "enum"
values = ["CHANNEL", "POLY"]
min = 0
max = 1
source = "spec"

[[param]]
id = "midi.filter_allow"
scope = "midi"
label = "MIDI filter: allow"
section = 0x04
set_item = 0x06
index = { name = "message", min = 0, max = 3 }
encoding = "enum"
list = "midi_channel"
min = 0
max = 31
source = "spec"
notes = "Index selects the message type (0 note on, 1 aftertouch, 2 wheels, 3 volume); the value is the channel on which to let it through. Applies to ports A and B."

[[param]]
id = "midi.filter_block"
scope = "midi"
label = "MIDI filter: block"
section = 0x04
set_item = 0x07
index = { name = "message", min = 0, max = 3 }
encoding = "enum"
list = "midi_channel"
min = 0
max = 31
source = "spec"
notes = "As midi.filter_allow, but makes the sampler ignore that message type on the channel."

# ------------------------------------------------------------ zone

[[param]]
id = "zone.sample"
scope = "zone"
label = "Sample"
section = 0x06
set_item = 0x01
get_item = 0x21
index = { name = "zone", min = 1, max = 4 }
encoding = "string"
source = "both"
notes = "Empty reply (single 00) when no sample is assigned. In .akp the name is length-prefixed at zone +1; s5k-formats reads it with zone_sample()."

[[param]]
id = "zone.level"
scope = "zone"
label = "Level"
section = 0x06
set_item = 0x02
get_item = 0x22
index = { name = "zone", min = 1, max = 4 }
encoding = "signed7"
min = -100
max = 100
file = { format = "akp", section = "Zone", field = "level" }
source = "both"

[[param]]
id = "zone.pan"
scope = "zone"
label = "Pan"
section = 0x06
set_item = 0x03
get_item = 0x23
index = { name = "zone", min = 1, max = 4 }
encoding = "offset"
offset = 64
min = -50
max = 50
file = { format = "akp", section = "Zone", field = "pan" }
source = "both"
notes = "-50 = L50, +50 = R50. The file stores the signed value directly."

[[param]]
