name: Release

# Pushing a tag like v0.1.0-alpha.1 builds the app and the s5k command for
# macOS, Windows and Linux and attaches them to a *draft* GitHub release;
# nothing is public until the draft is published. Running the workflow by
# hand (Actions -> Release -> Run workflow) builds the same files as workflow
# artifacts, without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags with a suffix (v0.1.0-alpha.1) are pre-releases.
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" --draft $pre --title "s5000-tools $TAG" --notes-file .github/release-notes.md
          # Drafts are not found by tag, so look the new one up in the list.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  app:
    needs: draft
    # Run without a release too (by hand), when the draft job is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle
          # The oldest supported Ubuntu, so the AppImage runs on more systems.
          - os: ubuntu-22.04
            args: ""
            targets: ""
            bundles: target/release/bundle
          - os: windows-latest
            args: ""
            targets: ""
            bundles: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux packages for the app (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Frontend packages
        working-directory: app
        run: npm ci
      - name: Build (and attach to the draft release)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.draft.outputs.id }}
      - name: Keep the bundles as artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            ${{ matrix.bundles }}/dmg/*.dmg
            ${{ matrix.bundles }}/macos/*.app
            ${{ matrix.bundles }}/appimage/*.AppImage
            ${{ matrix.bundles }}/deb/*.deb
            ${{ matrix.bundles }}/rpm/*.rpm
            ${{ matrix.bundles }}/msi/*.msi
            ${{ matrix.bundles }}/nsis/*.exe
          if-no-files-found: error

  cli:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive: s5k-macos-universal.tar.gz
          - os: ubuntu-22.04
            archive: s5k-linux-x86_64.tar.gz
          - os: windows-latest
            archive: s5k-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Build (macOS, Apple Silicon and Intel in one binary)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p s5k-cli --target aarch64-apple-darwin
          cargo build --release -p s5k-cli --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/s5k target/aarch64-apple-darwin/release/s5k target/x86_64-apple-darwin/release/s5k
          # Ad-hoc signature: macOS refuses to run unsigned Apple Silicon code.
          codesign -s - -f out/s5k
      - name: Build (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release -p s5k-cli
          mkdir -p out
          cp target/release/s5k* out/ 2>/dev/null || true
          rm -f out/*.d out/*.pdb
      - name: Package
        shell: bash
        run: |
          cp LICENSE docs/cli.md out/
          cd out
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            7z a "../${{ matrix.archive }}" .
          else
            tar czf "../${{ matrix.archive }}" .
          fi
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.archive }}"
      - name: Keep as an artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
